background {
    monitor =
    path = ~/.config/hyprlock/bg.jpg
}

background {
    monitor =
    zindex = 1
    path = ~/.config/hyprlock/fore.png
}

general {
    hide_cursor = true
}

# time
label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%H")"
  color = rgba(172, 166, 180, 1)
  font_size = 300
  font_family = Bebas Neue, Regular
  position = -160, 80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%M")"
  color = rgba(255, 255, 255, 1)
  font_size = 300
  font_family = Bebas Neue, Regular
  position = 160, 80
  halign = center
  valign = center
}


image {
  monitor = 
  path = ~/.config/hyprlock/user.png
  zindex = 1
  size = 150
  rounding = -1
  position = 0, -520
  halign = center
  valign = center
}

label {
  monitor = 
  text = $USER
  font_color = rgba(255, 255, 255, 1)
  font_family = Arial, Regular
  position = 0, -630
  halign = center
  valign = center
  zindex = 1
}

# PSWD PROMPT
input-field {
    monitor = 
    size = 220, 80
    outline_thickness = 2
    outer_color = rgba(0, 0, 0, 0.25)
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    rounding = 20
    dots_size = 0.15
    dots_spacing = 0.35
    dots_center = true
    check_color = rgba(255, 255, 255, 1)
    placeholder_text = <span foreground="##ffffff">Enter Password</span>
    hide_input = false
    font_family = Adwaita Sans, Regular
    position = 0, -720
    halign = center
    valign = center
    zindex = 1
}
